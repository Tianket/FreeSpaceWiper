# Publishes the version in app/build.gradle as a GitHub release: builds the APK with the same
# official toolchain as build.yml and attaches it, with its SHA-256, to release v<versionName>.
# Start it with Actions → Release → Run workflow, or by pushing a tag v<versionName>.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APK and the version
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|^sdkVersion|^targetSdkVersion|^uses-permission"
          "$BT/apksigner" verify --verbose --min-sdk-version 23 "$APK" | grep -E "^Verif"
          VERSION=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already released. Raise versionCode and versionName in app/build.gradle first."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Prepare the files
        run: |
          mkdir dist
          NAME="FreeSpaceWiper-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          cat "dist/$NAME.sha256"
          SHA=$(cut -d' ' -f1 "dist/$NAME.sha256")
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{SHA256}}|$SHA|g" \
              -e "s|{{URL}}|$URL|g" -e "s|{{TAG}}|$TAG|g" \
              .github/release-notes.md > notes.md
          cat notes.md

      - name: Publish the release
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Free Space Wiper $VERSION" --notes-file notes.md

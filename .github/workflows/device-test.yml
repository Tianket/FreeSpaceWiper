# Installs the APK on headless Android emulators and drives it like a person would:
# first launch, a complete wipe, pause and stop, a killed process, low battery, a reboot.
# The checks read the real state of the device (files, services, wake lock, notification).
# Screenshots and logs of every run are attached as "device-test-apiNN".
name: Device test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [23, 30, 34]   # Android 6, 11, 14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK
        run: ./gradlew --no-daemon -q assembleRelease

      - name: Boot emulator
        run: ci/emulator.sh ${{ matrix.api }}

      - name: Drive the app
        run: |
          "$ANDROID_HOME/platform-tools/adb" install -r app/build/outputs/apk/release/app-release.apk
          python3 ci/device_test.py out

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: device-test-api${{ matrix.api }}
          path: out/
          if-no-files-found: ignore
